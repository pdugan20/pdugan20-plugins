name: Release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish marketplace release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required only for creating the tagged GitHub release.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: |
          python3 scripts/validate_repository.py --release-tag "$GITHUB_REF_NAME"
          npm run verify

      - name: Extract curated release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
