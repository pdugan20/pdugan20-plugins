name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install claudelint
        run: npm install -g claude-code-lint

      - name: Validate marketplace manifest
        run: claudelint validate-plugin

      - name: Validate Codex marketplace JSON
        run: python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
