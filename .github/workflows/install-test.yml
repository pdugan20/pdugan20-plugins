name: Install Test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Marketplace install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use HTTPS for GitHub clones
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/" --add

      - name: Install Claude Code plugins
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          CLAUDE_CONFIG_DIR="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR
          claude plugin marketplace add anthropics/claude-plugins-official
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install claudelint@patrick-plugins
          claude plugin install patrick-skills@patrick-plugins
          list="$(claude plugin list --json)"
          echo "$list" | jq -e '[.[] | select((.errors // []) | length > 0)] | length == 0' > /dev/null \
            || { echo "FAIL: plugin errors present:"; echo "$list" | jq '.[] | {id, errors}'; exit 1; }

      - name: Install Codex plugins
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add patrick-skills@patrick-plugins
          codex plugin list
